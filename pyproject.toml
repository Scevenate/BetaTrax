[project]
name = "betatrax"
version = "0.1.0"
description = "A defect report management system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.3",
    "django-tenants>=3.10.1",
    "djangorestframework>=3.17.1",
    "gunicorn>=25.3.0",
    "psycopg[binary]>=3.3.3",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "ruff>=0.15.7",
]
